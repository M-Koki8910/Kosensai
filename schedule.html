<title>スケジュール</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:sans-serif;
    padding:16px;
    background:#f5f5f5;
}

.day{
    margin-bottom:40px;
}

.day h2{
    margin-bottom:10px;
}

.timetable{
    display:grid;
    grid-template-columns:60px 1fr 1fr;
    grid-template-rows:40px repeat(10, 80px);
    background:white;
    border:1px solid #ccc;
    position:relative;
}

.header{
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    border-bottom:1px solid #ccc;
    border-right:1px solid #ccc;
    background:#fafafa;
}

.time{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding-top:4px;
    font-size:0.9rem;
    border-right:1px solid #ccc;
    border-bottom:1px solid #ccc;
}

.cell{
    border-right:1px solid #ccc;
    border-bottom:1px solid #ccc;
    position:relative;
}

.cell:nth-child(3n){
    border-right:none;
}

.event{
    position:absolute;
    left:4px;
    right:4px;
    background:#4a90e2;
    color:white;
    border-radius:6px;
    padding:6px;
    font-size:0.8rem;
    overflow:hidden;
}
</style>

</head>
