<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>掲示板 - 高専祭</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .bulletin-section {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .post-form {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }

    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      min-height: 100px;
      font-family: sans-serif;
    }

    .form-group input[type="text"],
    .form-group input[type="email"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn:hover {
      background: #0056b3;
    }

    .btn-secondary {
      background: #6c757d;
    }

    .btn-secondary:hover {
      background: #545b62;
    }

    .post-list {
      margin-top: 30px;
    }

    .post-item {
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 10px;
    }

    .post-item.aggregated {
      background: #f0f7ff;
      border-left: 4px solid #007bff;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 12px;
      color: #666;
    }

    .post-date {
      color: #999;
    }

    .post-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: bold;
    }

    .post-status.published {
      background: #d4edda;
      color: #155724;
    }

    .post-status.pending {
      background: #fff3cd;
      color: #856404;
    }

    .post-status.review {
      background: #cfe2ff;
      color: #084298;
    }

    .post-status.rejected {
      background: #f8d7da;
      color: #721c24;
    }

    .post-status.hidden {
      background: #e2e3e5;
      color: #383d41;
    }

    .post-content {
      margin-bottom: 10px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .post-count {
      color: #666;
      font-size: 12px;
    }

    .message {
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .message.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #007bff;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .character-count {
      text-align: right;
      font-size: 12px;
      color: #999;
      margin-top: 5px;
    }

    .disclaimer {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #856404;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>高専祭 掲示板</h1>
    
    <div id="message" class="message"></div>

    <div class="post-form">
      <h2>投稿する</h2>
      <div class="disclaimer">
        ℹ️ ご投稿いただいた内容は匿名で表示されます。投稿後、安全性の確認が行われます。
      </div>

      <form id="postForm">
        <div class="form-group">
          <label for="postContent">コメント（最大500字）</label>
          <textarea id="postContent" placeholder="高専祭の感想やコメントをお寄せください..." maxlength="500" required></textarea>
          <div class="character-count"><span id="charCount">0</span>/500</div>
        </div>

        <button type="submit" class="btn">投稿する</button>
      </form>
    </div>

    <div class="post-list">
      <h2>最新の投稿</h2>
      <div id="postContainer" class="loading">
        <div class="spinner"></div>
        <p>投稿を読み込み中...</p>
      </div>
    </div>
  </div>

  <script>
    const POSTS_API = '/api/posts';
    const AUTO_REFRESH_INTERVAL = 10 * 1000; // 10秒ごと

    // 文字数カウント
    document.getElementById('postContent').addEventListener('input', (e) => {
      document.getElementById('charCount').textContent = e.target.value.length;
    });

    // メッセージ表示
    function showMessage(text, type = 'info') {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = `message show ${type}`;
      if (type === 'success') {
        setTimeout(() => msg.classList.remove('show'), 4000);
      }
    }

    // フォーム送信
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = document.getElementById('postContent').value.trim();

      if (!content) {
        showMessage('コメントを入力してください', 'error');
        return;
      }

      try {
        const response = await fetch(POSTS_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });

        const data = await response.json();

        if (data.ok) {
          showMessage('投稿を受け付けました！しばらくして表示されます。', 'success');
          document.getElementById('postContent').value = '';
          document.getElementById('charCount').textContent = '0';
          loadPosts();
        } else {
          showMessage(data.error || '投稿に失敗しました', 'error');
        }
      } catch (e) {
        showMessage('通信エラーが発生しました', 'error');
        console.error(e);
      }
    });

    // 投稿一覧読み込み
    async function loadPosts() {
      try {
        const response = await fetch(`${POSTS_API}?status=published&limit=30`);
        const data = await response.json();

        if (!data.ok) {
          document.getElementById('postContainer').innerHTML = '<p>投稿を読み込めませんでした</p>';
          return;
        }

        const posts = data.posts || [];

        if (posts.length === 0) {
          document.getElementById('postContainer').innerHTML = '<p>投稿がまだありません</p>';
          return;
        }

        let html = '';
        for (const post of posts) {
          const date = new Date(post.created_at).toLocaleString('ja-JP');
          const statusLabel = getStatusLabel(post.status);

          let classes = 'post-item';
          // TODO: 集約されている投稿の判定

          html += `
            <div class="${classes}">
              <div class="post-header">
                <span class="post-date">${date}</span>
                <span class="post-status ${post.status}">${statusLabel}</span>
              </div>
              <div class="post-content">${escapeHtml(post.content)}</div>
            </div>
          `;
        }

        document.getElementById('postContainer').innerHTML = html;
      } catch (e) {
        console.error('投稿読み込みエラー', e);
        document.getElementById('postContainer').innerHTML = '<p>投稿を読み込めませんでした</p>';
      }
    }

    function getStatusLabel(status) {
      const labels = {
        'published': '公開済み',
        'pending': '確認中',
        'review': '要確認',
        'rejected': '非表示',
        'hidden': '非表示'
      };
      return labels[status] || status;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 初期読み込み
    loadPosts();

    // 定期更新
    setInterval(() => {
      loadPosts();
    }, AUTO_REFRESH_INTERVAL);
  </script>
</body>
</html>
