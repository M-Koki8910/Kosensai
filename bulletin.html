  <link rel="stylesheet" href="./style.css">
  <title>掲示板 - 高専祭</title>

  <style>
    .post-container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .postcard {
      width: 100%;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn:hover { background: #0056b3; }

    .message {
      display: none;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    .message.show { display: block; }
    .message.success { background: #d4edda; color: #155724; }
    .message.error { background: #f8d7da; color: #721c24; }
    .message.info { background: #d1ecf1; color: #0c5460; }

    .post-item {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }

    .post-status.published { color: green; }
    .post-status.pending { color: orange; }
    .post-status.rejected { color: red; }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .spinner {
      border: 3px solid #eee;
      border-top: 3px solid #007bff;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      margin: 0 auto;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    textarea {
      width: 100%;
      min-height: 100px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
