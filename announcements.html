<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アナウンス - 高専祭</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .announcements-section {
      margin-bottom: 40px;
    }

    .announcement-item {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
      border-left: 5px solid #007bff;
    }

    .announcement-item.urgent {
      background: #fff5f5;
      border-left-color: #dc3545;
      box-shadow: 0 2px 10px rgba(220, 53, 69, 0.1);
    }

    .announcement-item.important {
      background: #fff9e6;
      border-left-color: #ffc107;
      box-shadow: 0 2px 10px rgba(255, 193, 7, 0.1);
    }

    .announcement-item.normal {
      background: #f9f9f9;
      border-left-color: #007bff;
    }

    .announcement-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .announcement-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      flex: 1;
    }

    .announcement-importance {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      margin-left: 10px;
    }

    .importance-urgent {
      background: #dc3545;
      color: white;
    }

    .importance-important {
      background: #ffc107;
      color: #333;
    }

    .importance-normal {
      background: #e9ecef;
      color: #666;
    }

    .announcement-content {
      margin: 15px 0;
      line-height: 1.6;
      color: #555;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .announcement-meta {
      font-size: 12px;
      color: #999;
      border-top: 1px solid #eee;
      padding-top: 10px;
      margin-top: 10px;
    }

    .announcement-meta span {
      display: inline-block;
      margin-right: 20px;
    }

    .no-announcements {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      color: #999;
    }

    .announcements-list {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      margin-top: 30px;
      padding-bottom: 10px;
      border-bottom: 2px solid #007bff;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    .info-box {
      background: #d1ecf1;
      border: 1px solid #bee5eb;
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 20px;
      color: #0c5460;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #007bff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>高専祭 お知らせ</h1>

    <div class="info-box">
      ℹ️ 重要なお知らせが掲載されています。ご来場前にご確認ください。
    </div>

    <div id="announcementsContainer" class="loading">
      <div class="spinner"></div>
      <p>お知らせを読み込み中...</p>
    </div>
  </div>

  <script>
    const ANNOUNCEMENTS_API = '/api/announcements';
    const AUTO_REFRESH_INTERVAL = 30 * 1000; // 30秒ごと

    async function loadAnnouncements() {
      try {
        const response = await fetch(ANNOUNCEMENTS_API);
        const data = await response.json();

        if (!data.ok) {
          document.getElementById('announcementsContainer').innerHTML = 
            '<div class="no-announcements">お知らせを読み込めませんでした</div>';
          return;
        }

        const announcements = data.announcements || [];

        if (announcements.length === 0) {
          document.getElementById('announcementsContainer').innerHTML = 
            '<div class="no-announcements">現在、特別なお知らせはありません</div>';
          return;
        }

        // 重要度でソート
        const sortedAnnouncements = [...announcements].sort((a, b) => {
          const importance = { 'urgent': 0, 'important': 1, 'normal': 2 };
          return importance[a.importance] - importance[b.importance];
        });

        // 重要度ごとにグループ化
        const urgent = sortedAnnouncements.filter(a => a.importance === 'urgent');
        const important = sortedAnnouncements.filter(a => a.importance === 'important');
        const normal = sortedAnnouncements.filter(a => a.importance === 'normal');

        let html = '';

        if (urgent.length > 0) {
          html += '<div class="section-title">🚨 緊急のお知らせ</div>';
          html += '<div class="announcements-list">';
          html += urgent.map(a => renderAnnouncement(a)).join('');
          html += '</div>';
        }

        if (important.length > 0) {
          html += '<div class="section-title">⚠️ 重要なお知らせ</div>';
          html += '<div class="announcements-list">';
          html += important.map(a => renderAnnouncement(a)).join('');
          html += '</div>';
        }

        if (normal.length > 0) {
          html += '<div class="section-title">ℹ️ その他のお知らせ</div>';
          html += '<div class="announcements-list">';
          html += normal.map(a => renderAnnouncement(a)).join('');
          html += '</div>';
        }

        document.getElementById('announcementsContainer').innerHTML = html;
      } catch (e) {
        console.error('アナウンス読み込みエラー', e);
        document.getElementById('announcementsContainer').innerHTML = 
          '<div class="no-announcements">お知らせを読み込めませんでした</div>';
      }
    }

    function renderAnnouncement(announcement) {
      const publishedAt = new Date(announcement.published_at).toLocaleString('ja-JP');
      const expiresAt = new Date(announcement.expires_at).toLocaleString('ja-JP');
      const importanceLabel = getImportanceLabel(announcement.importance);

      return `
        <div class="announcement-item ${announcement.importance}">
          <div class="announcement-header">
            <div class="announcement-title">${escapeHtml(announcement.title)}</div>
            <span class="announcement-importance importance-${announcement.importance}">
              ${importanceLabel}
            </span>
          </div>
          <div class="announcement-content">${escapeHtml(announcement.content)}</div>
          <div class="announcement-meta">
            <span>公開: ${publishedAt}</span>
            <span>終了: ${expiresAt}</span>
          </div>
        </div>
      `;
    }

    function getImportanceLabel(importance) {
      const labels = {
        'urgent': '緊急',
        'important': '重要',
        'normal': '通常'
      };
      return labels[importance] || importance;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 初期読み込み
    loadAnnouncements();

    // 定期更新
    setInterval(() => {
      loadAnnouncements();
    }, AUTO_REFRESH_INTERVAL);
  </script>
</body>
</html>
