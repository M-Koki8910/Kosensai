        const foodShops = shops.filter(shop => shop.category === 'food');
        const experienceShops = shops.filter(shop => shop.category === 'experience');

        // カード生成関数
        function createCard(shop) {
            const card = document.createElement('div');
            card.className = 'card shop-card';
            
            // 商品名を表示用に調整（長すぎる場合は省略）
            const productDisplay = shop.product.length > 30 
                ? shop.product.substring(0, 30) + '...' 
                : shop.product;
            
            card.innerHTML = `
                <img src="./images/shop.jpg" alt="${shop.name}">
                <div class="card-body">
                    <h3>${shop.name}</h3>
                </div>
                <div class="detail" title="${shop.product}">${productDisplay}</div>
            `;
            card.addEventListener('click', () => openModal(shop));
            return card;
        }

        // グリッドにカードを追加
        const foodGrid = document.getElementById('food-grid');
        foodShops.forEach(shop => {
            foodGrid.appendChild(createCard(shop));
        });

        const experienceGrid = document.getElementById('experience-grid');
        experienceShops.forEach(shop => {
            experienceGrid.appendChild(createCard(shop));
        });

        // モーダル制御
        const modal = document.getElementById('shopModal');
        const closeBtn = document.querySelector('.close');

        function openModal(shop) {
            document.getElementById('modalTitle').textContent = shop.name;
            document.getElementById('modalProduct').textContent = shop.product;
            document.getElementById('modalDescription').textContent = shop.description;
            modal.style.display = 'block';
        }

        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
