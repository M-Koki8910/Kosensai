<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アクセスできません</title>

    <link rel="stylesheet" href="./style.css">

    <style>
        /* ===== 強制縦レイアウト補正 ===== */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero {
            width: 100%;
        }

        .hero-text {
            text-align: center;
        }

        /* カードの横並び防止 */
        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* a.cardの横並び要素を縦に */
        .card {
            width: 100%;
            max-width: 500px;
            display: block;
            text-decoration: none;
        }

        .card-body {
            text-align: center;
        }

        /* テキスト整形 */
        p {
            text-align: center;
        }
    </style>

</head>

<body>

    <div class="topbar">
        <a href="./index.html" class="home-link">
            <img src="./images/logo.png" alt="高専祭TOP" class="logo">
            <link rel="icon" type="image/png" href="./images/tab-resize.png">

    </div>

    <main>

        <section class="hero">
            <div class="hero-text">
                <h1>アクセスできません</h1>
                <p>このページは現在公開されていません。</p>
            </div>
        </section>

        <section class="container" style="text-align:center; padding: 60px 20px;">

            <h2>お知らせ</h2>

            <p style="margin-top:20px; line-height:1.8;">
                申し訳ありません。<br>
                現在このコンテンツは非公開設定となっています。
            </p>

            <a href="./index.html" class="card" style="display:inline-block; margin-top:30px;">
                <div class="card-body">
                    <h3>トップページへ戻る</h3>
                    <p>高専祭TOPに移動します</p>
                </div>
            </a>

        </section>

    </main>

    <footer>
        <p>© 2026 松江高専 高専祭実行委員</p>
    </footer>

</body>

</html>
