    <style>
        /* ==========================
   Schedule Page
========================== */

        .schedule-page {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
        }

        .schedule-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .schedule-tabs button {
            flex: 1;
            border: none;
            border-radius: 999px;
            padding: 12px;

            font-size: 1rem;
            font-weight: bold;

            cursor: pointer;

            background: #ddd;
        }

        .schedule-tabs button.active {
            background: #1aa4e8;
            color: #fff;
        }

        /* タイムテーブル */

        .schedule-board {
            --schedule-row-height: 72px;
            --schedule-header-height: 78px;
            --schedule-time-width: 60px;
            --schedule-time-offset: 12px;

            background: #8fd0ee;
            border-radius: 32px;
            padding: 16px 16px 18px;
        }

        .schedule-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .schedule-layout {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        /* 時間列 */

        .schedule-times {
            position: relative;
            width: var(--schedule-time-width);
            height: calc((19 - 9 + 1) * var(--schedule-row-height));
            margin-top: var(--schedule-header-height);
            box-sizing: border-box;
        }

        .schedule-hour {
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 52px;
            height: 52px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #1aa4e8;
            color: white;

            border-radius: 50%;
            border: 2px solid white;

            font-size: 1.2rem;
            font-weight: bold;

            box-shadow: 0 4px 10px rgba(0, 0, 0, .15);
        }

        /* メイン */

        .schedule-main {
            flex: 1;

            background: white;

            border: 2px solid #18354a;

            border-radius: 32px;

            overflow: hidden;

            position: relative;
        }

        .schedule-header {
            height: var(--schedule-header-height);

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px 10px;
            box-sizing: border-box;
        }

        .schedule-place {
            padding: 12px 20px;

            border-radius: 14px;

            font-size: 1.1rem;
            font-weight: bold;
        }

        .schedule-place.gym {
            background: #f7b58f;
        }

        .schedule-place.garden {
            background: #aad494;
        }

        .schedule-grid {
            position: relative;
            padding-bottom: 6px;
        }

        .schedule-row {
            height: var(--schedule-row-height);
            border-top: 2px solid #222;
            position: relative;
            box-sizing: border-box;
        }

        .schedule-row::after {
            content: "";

            position: absolute;

            left: 0;
            right: 0;
            top: 50%;

            border-top: 1px dashed #555;
        }

        /* イベント */

        .schedule-event {
            position: absolute;

            left: 12px;
            right: 12px;

            border-radius: 14px;

            padding: 8px 10px;

            color: white;

            text-decoration: none;
            font-weight: bold;

            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.3;
            font-size: 0.96rem;

            box-shadow: 0 4px 10px rgba(0, 0, 0, .15);

            z-index: 10;
        }

        .schedule-event.gym {
            background: #ff9966;
        }

        .schedule-event.garden {
            background: #5ebd6c;
        }

        .event-detail {
            margin: 18px auto;
            padding: 16px;
            max-width: 760px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .event-detail h3 {
            margin: 0 0 8px;
        }

        .event-detail .event-meta {
            color: #475569;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .event-detail p {
            margin: 0 0 12px;
            color: #273043;
        }

        .btn-close {
            display: inline-block;
            padding: 8px 12px;
            background: #1aa4e8;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
        }
    </style>

    <script>

        const EVENTS = [

            {
                day: 1,
                place: "gym",
                title: "ゲストライブ",
                start: 11,
                end: 12,
                href: "./event.html",
            },
            {
                day: 1,
                place: "gym",
                title: "吹奏楽部コンサート",
                start: 13,
                end: 14,
                href: "./event.html",
            },
            {
                day: 1,
                place: "gym",
                title: "学生ライブ",
                start: 15,
                end: 19,
                href: "./event.html",
            },
            {
                day: 2,
                place: "gym",
                title: "カラオケ大会",
                start: 10,
                end: 11,
                href: "./event.html",
            },
            {
                day: 2,
                place: "gym",
                title: "ダンス部パフォーマンス",
                start: 12,
                end: 13,
                href: "./event.html",
            },
            {
                day: 2,
                place: "gym",
                title: "抽選会　(※学生のみ参加可)",
                start: 15,
                end: 19,
                href: "./event.html",
            },
            {
                day: 1,
                place: "garden",
                title: "模擬店紹介",
                start: 9,
                end: 10,
                href: "./event.html",
            },
            {
                day: 1,
                place: "garden",
                title: "大食い",
                start: 10,
                end: 11,
                href: "./event.html",
            },
            {
                day: 1,
                place: "garden",
                title: "フィジーク",
                start: 12,
                end: 13,
                href: "./event.html",
            },
            {
                day: 1,
                place: "garden",
                title: "クイズ",
                start: 14,
                end: 15,
                href: "./event.html",
            },
            {
                day: 2,
                place: "garden",
                title: "パフォーマンス書道",
                start: 9,
                end: 10,
                href: "./event.html",
            },
            {
                day: 2,
                place: "garden",
                title: "誰が一位でしょう？",
                start: 11,
                end: 12,
                href: "./event.html",
            },
            {
                day: 2,
                place: "garden",
                title: "腕相撲",
                start: 13,
                end: 14,
                href: "./event.html",
            }

        ];

        let currentDay = 1;
        let currentPlace = "gym";

        document.querySelectorAll(".schedule-day-tab").forEach(button => {

            button.addEventListener("click", () => {

                document
                    .querySelectorAll(".schedule-day-tab")
                    .forEach(b => b.classList.remove("active"));

                button.classList.add("active");

                currentDay = Number(button.dataset.day);

                render();
            });

        });

        document.querySelectorAll(".schedule-place-tab").forEach(button => {

            button.addEventListener("click", () => {

                document
                    .querySelectorAll(".schedule-place-tab")
                    .forEach(b => b.classList.remove("active"));

                button.classList.add("active");

                currentPlace = button.dataset.place;

                render();
            });

        });

        const ROW_HEIGHT = 72;
        const START_HOUR = 9;

        function render() {



            const view =
                document.getElementById("schedule-view");

            const placeName =
                currentPlace === "gym"
                    ? "体育館"
                    : "学びの庭";

            let html = `
<div class="schedule-board">

    <div class="schedule-title">
        ${currentDay}日目
    </div>

    <div class="schedule-layout">

        <div class="schedule-times">
`;

            for (let i = START_HOUR; i <= 19; i++) {
                const index = i - START_HOUR;

                html += `
        <div class="schedule-hour" style="top:${index * ROW_HEIGHT}px;">
            ${i}
        </div>
    `;
            }

            html += `
        </div>

        <div class="schedule-main">

            <div class="schedule-header">
                <div class="schedule-place ${currentPlace}">
                    ${placeName}
                </div>
            </div>

            <div class="schedule-grid">
`;

            for (let i = START_HOUR; i <= 19; i++) {

                html += `<div class="schedule-row"></div>`;
            }

            const filtered =
                EVENTS.filter(event =>
                    event.day === currentDay &&
                    event.place === currentPlace
                );

            filtered.forEach(event => {

                const top =
                    (event.start - START_HOUR) * ROW_HEIGHT;

                const height =
                    (event.end - event.start) * ROW_HEIGHT;

                const gid = EVENTS.findIndex(e => e === event);
                const targetId = `event-${gid}`;
                const hrefTarget = event.href ? event.href : `#${targetId}`;

                html += `
            <a
                href="${hrefTarget}"
                class="schedule-event ${event.place}"
                style="
                    top:${top}px;
                    height:${height}px;
                "
            >
                ${event.title}
            </a>
        `;
            });

            html += `
                    </div>

                </div>

            </div>

        </div>
    `;

            view.innerHTML = html;
        }
        // 補助: イベント詳細セクション生成（同じページ内リンク先）
        function renderEventDetails() {
            const container = document.getElementById('schedule-view');
            if (!container) return;

            let details = '<div id="event-details">';

            EVENTS.forEach((event, idx) => {
                details += `
            <section id="event-${idx}" class="event-detail">
                <h3>${event.title}</h3>
                <div class="event-meta">${event.day}日目・${event.place}・${event.start}:00〜${event.end}:00</div>
                <p>${event.description || ''}</p>
                <a href="#schedule-view" class="btn-close">スケジュールに戻る</a>
            </section>
        `;
            });

            details += '</div>';

            container.insertAdjacentHTML('beforeend', details);
        }

        // 初回描画後に詳細を追加
        render();
        //renderEventDetails();
    </script>
